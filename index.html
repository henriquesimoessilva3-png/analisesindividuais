<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botafogo · Stats Individuais 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9a227;--dark:#111;--mid:#1a1a1a;--card:#1e1e1e;--border:#2a2a2a;--text:#eee;--muted:#666;--green:#27ae60;--red:#e74c3c;--blue:#2980b9;--orange:#e67e22;--purple:#8e44ad}
body{background:var(--dark);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* LIGHT MODE */
body.light{--dark:#f0f2f5;--mid:#e8eaef;--card:#ffffff;--border:#d0d4dc;--text:#1a1a2e;--muted:#6b7280;--gold:#9a7209}
body.light .topbar{background:#ffffff;border-bottom:2px solid var(--gold)}
body.light .sidebar{background:#eef0f5}
body.light .sidebar-header{background:#eef0f5}
body.light .pos-filter{background:#eef0f5}
body.light .sidebar-search{background:#ffffff;border-color:#c8ccd6;color:#1a1a2e}
body.light .pos-btn{background:#ffffff;border-color:#c8ccd6;color:#555}
body.light .player-list{background:#eef0f5}
body.light .player-item{border-bottom-color:#dde0ea}
body.light .player-item:hover{background:#dce0ea}
body.light .player-item.active{background:#b8860b15;border-left:2px solid var(--gold)}
body.light .player-card{background:#ffffff;border-color:#d0d4dc;box-shadow:0 1px 4px rgba(0,0,0,.07)}
body.light .player-avatar{filter:saturate(1.2)}
body.light .player-card:hover{border-color:#9a7209;box-shadow:0 2px 8px rgba(0,0,0,.12)}
body.light .overview-metric{background:#f3f5f9;color:#1a1a2e}
body.light .metric-card{background:#f3f5f9;border-color:#dde0ea}
body.light .metric-lbl{color:#6b7280}
body.light .chart-section{background:#ffffff;border-color:#d0d4dc}
body.light .forma-card{background:#f3f5f9;border-color:#dde0ea}
body.light .consist-card{background:#f3f5f9;border-color:#dde0ea}
body.light .section-title{color:#888;border-bottom-color:#d0d4dc}
body.light .dtab{background:#e8eaef;border-color:#c8ccd6;color:#555}
body.light .dtab:hover{color:#1a1a2e}
body.light .dtab.active{background:var(--gold);color:#fff;border-color:var(--gold)}
body.light .game-table{background:#ffffff}
body.light .game-table th{background:#f0f2f7;color:#888;border-bottom-color:#d0d4dc}
body.light .game-table td{border-bottom-color:#ebedf3;color:#1a1a2e}
body.light .game-table tr:hover td{background:#f5f7fb}
body.light .badge-games{background:#dbeafe;color:#1d4ed8}
body.light .badge-bfr{background:#dcfce7;color:#166534}
body.light .badge.r-V{background:#dcfce7;color:#166534}
body.light .badge.r-D{background:#fee2e2;color:#991b1b}
body.light .badge.r-E{background:#fef9c3;color:#854d0e}
body.light .carga-alert{background:#fff7ed;border-color:#f97316;color:#7c2d12}
body.light .carga-alert-text{color:#9a3412}
body.light .carga-alert-text strong{color:#c2410c}
body.light .alerts-panel{background:rgba(249,115,22,0.06);border-color:rgba(249,115,22,0.25);border-left-color:#f97316}
body.light .detail-header{border-bottom-color:#d0d4dc}
body.light .detail-name{color:#1a1a2e}
body.light .detail-pos{filter:saturate(0.8) brightness(0.8)}
/* Remover negrito dos valores numéricos no modo claro */
body.light .pc-stat-val,
body.light .metric-val,
body.light .forma-recent,
body.light .bench-val,
body.light .bench-pct-val,
body.light .ctx-half-val,
body.light .tl-val,
body.light .pct-ring{font-weight:500}
body.light .topbar-btn{background:#eef0f5;color:#444;border:1px solid #c8ccd6}
body.light .topbar-btn:hover{border-color:var(--gold);color:var(--gold)}
body.light .metric-select{background:#f3f5f9;border-color:#c8ccd6;color:#1a1a2e}
body.light #prompt-modal > div{background:#f3f5f9;border-color:var(--gold)}
body.light #ia-result{background:#f3f5f9;border-color:#d0d4dc;color:#1a1a2e}
body.light #ia-loading{color:#6b7280}
body.light #ia-key{background:#ffffff;border-color:#c8ccd6;color:#1a1a2e}
body.light .content{background:#f0f2f5}
body.light .pc-stat{background:#eef0f5}
body.light .consist-bar-wrap{background:#dde0ea}
body.light .ctx-half{background:#eef0f5}
body.light .bench-bar-bg{background:#dde0ea}
body.light .cbar{background:#eef0f5}
body.light .r-V{background:#dcfce7;color:#166534;border-color:#86efac}
body.light .r-D{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
body.light .r-E{background:#fef9c3;color:#854d0e;border-color:#fde047}

/* TOPBAR */
.topbar{background:#0a0a0a;border-bottom:2px solid var(--gold);padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}

.topbar-btn{background:#1e1e1e;border:1px solid var(--border);color:var(--muted);padding:4px 10px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;border-radius:3px;text-transform:uppercase;transition:all .15s}
.topbar-btn:hover{border-color:var(--gold);color:var(--gold)}
.topbar-btn.active-lang{color:var(--gold);border-color:var(--gold)}

.logo{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:var(--gold);letter-spacing:2px;text-transform:uppercase}
.tabs{display:flex;gap:2px}
.tab{background:transparent;border:none;color:var(--muted);padding:6px 16px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden;min-height:0}
.sidebar{width:195px;flex-shrink:0;background:var(--mid);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sidebar-header{padding:10px 12px 6px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-header label{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:4px}
.sidebar-search{width:100%;background:#161616;border:1px solid var(--border);color:var(--text);padding:5px 8px;font-size:12px;font-family:'Barlow',sans-serif;outline:none}
.sidebar-search:focus{border-color:var(--gold)}
.pos-filter{display:flex;flex-wrap:wrap;gap:3px;padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.pos-btn{background:#161616;border:1px solid var(--border);color:var(--muted);padding:2px 6px;font-size:9px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;transition:all .1s;border-radius:2px}
.pos-btn:hover,.pos-btn.active{background:var(--gold);color:#111;border-color:var(--gold)}
.player-list{flex:1;overflow-y:auto}
.player-list::-webkit-scrollbar{width:3px}
.player-list::-webkit-scrollbar-thumb{background:var(--border)}
.player-item{padding:5px 8px;cursor:pointer;border-bottom:0.5px solid #181818;transition:background .1s;display:flex;align-items:center;gap:6px}
.player-item:hover{background:#1e1e1e}
.player-item.active{background:#251e00;border-left:3px solid var(--gold);padding-left:5px}
.player-avatar{width:26px;height:26px;border-radius:50%;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:.3px}
.p-name{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text)}
.p-pos{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* CONTENT */
.content{flex:1;overflow-y:auto;padding:14px;background:#141414;position:relative}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border)}
/* OVERVIEW */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:10px}
.player-card{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:12px;cursor:pointer;transition:border-color .15s;position:relative}
.player-card:hover{border-color:#444}
.player-card.has-alert{border-left:3px solid var(--red)}
.alert-dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.pc-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800}
.pc-pos{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.pc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.pc-stat{background:#161616;padding:5px 6px;border-radius:3px;text-align:center}
.pc-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800}
.pc-stat-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.form-bar{margin-top:6px}
.form-bar-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;display:flex;justify-content:space-between}
.form-track{display:flex;gap:3px;height:6px}
.form-segment{flex:1;border-radius:1px}
.badge{font-size:9px;padding:2px 7px;border-radius:2px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.5px}
.badge-games{background:#1e2a3a;color:#5b9bd5}
.badge-bfr{background:#1a261a;color:#5ba55b}
.pc-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
/* ALERTS */
.alerts-panel{background:rgba(231,76,60,0.06);border:1px solid rgba(231,76,60,0.2);border-left:3px solid var(--red);border-radius:5px;padding:10px 14px;margin-bottom:14px}
.alerts-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:rgba(231,76,60,0.9);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.alert-list{display:flex;flex-wrap:wrap;gap:6px}
.alert-item{background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.22);padding:6px 12px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:8px}
.alert-player{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--text);font-size:12px}
.alert-msg{color:var(--muted);font-size:10px}
/* DETAIL */
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.detail-name{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.detail-pos{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.detail-badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.detail-tabs{display:flex;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.dtab{background:#1a1a1a;border:1px solid var(--border);color:var(--muted);padding:5px 14px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .1s}
.dtab.active{background:var(--gold);color:#111;border-color:var(--gold)}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px;margin-bottom:14px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:9px;text-align:center}
.metric-val{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800}
.metric-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.chart-section{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:12px;margin-bottom:10px}
.chart-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chart-container{position:relative;height:190px}
.chart-container.tall{height:260px}
.metric-select{background:#161616;border:1px solid var(--border);color:var(--text);padding:3px 8px;font-size:11px;font-family:inherit;cursor:pointer;outline:none}
.metric-select:focus{border-color:var(--gold)}
.game-table{width:100%;border-collapse:collapse;font-size:12px}
.game-table th{background:#1a1a1a;color:var(--muted);padding:5px 8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
.game-table td{padding:5px 8px;border-bottom:1px solid #191919;text-align:center}.game-table td:first-child{text-align:left}
.game-table tr:hover td{background:#1e1e1e}
.game-table td.num{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
/* FORMA */
.forma-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:12px}
.forma-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:10px}
.forma-metric{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.forma-vals{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.forma-recent{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800}
.forma-avg{font-size:11px;color:var(--muted)}
.forma-arrow{font-size:13px;font-weight:700}
.forma-games{display:flex;gap:4px;margin-top:6px}
.forma-game-dot{flex:1;height:20px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700}
/* CONSISTÊNCIA */
.consist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.consist-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:10px}
.consist-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-family:'Barlow Condensed',sans-serif}
.consist-bar-wrap{position:relative;height:8px;background:#161616;border-radius:4px;overflow:hidden;margin-bottom:4px}
.consist-bar{height:100%;border-radius:4px;transition:width .5s}
.consist-stats{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
/* DESTAQUES */
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:14px}
.tl-dot{position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--gold);background:var(--dark)}
.tl-dot.gold{background:var(--gold)}
.tl-dot.red{border-color:var(--red);background:var(--red)}
.tl-dot.blue{border-color:var(--blue);background:var(--blue)}
.tl-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700}
.tl-sub{font-size:11px;color:var(--muted);margin-top:1px}
.tl-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--gold);margin-top:2px}
/* CONTEXTUAL */
.ctx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ctx-card{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:12px}
.ctx-card-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.ctx-split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctx-half{text-align:center;padding:8px;background:#161616;border-radius:3px}
.ctx-half-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.ctx-half-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800}
.ctx-half-sub{font-size:10px;color:var(--muted);margin-top:2px}
.ctx-badge{font-size:10px;padding:2px 8px;border-radius:2px;font-family:'Barlow Condensed',sans-serif;font-weight:700}
.ctx-metric-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a1a1a;font-size:12px}
.ctx-metric-row:last-child{border-bottom:none}
.ctx-metric-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.ctx-metric-vals{display:flex;gap:10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700}
/* BENCHMARKING */
.bench-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.bench-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:10px}
.bench-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-family:'Barlow Condensed',sans-serif}
.bench-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bench-bar-bg{flex:1;height:12px;background:#161616;border-radius:6px;overflow:hidden;position:relative}
.bench-bar-fill{height:100%;border-radius:6px;transition:width .6s}
.bench-val{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;min-width:36px;text-align:right}
.bench-pct{display:flex;justify-content:space-between;font-size:10px}
.bench-pct-val{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700}
.bench-rank{color:var(--muted)}
.pct-ring{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;border:3px solid}
/* RESULT BADGES */
.r-V{background:#0d2a0d;color:#5ba55b;border:1px solid #1a3a1a}
.r-E{background:#2a2a00;color:#c9a227;border:1px solid #3a3a00}
.r-D{background:#2a0d0d;color:#e74c3c;border:1px solid #3a1515}
/* COMPARE */
.compare-controls{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.compare-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;flex:1;min-width:180px}
.cbar-row{display:grid;grid-template-columns:110px 1fr 50px 1fr 50px;gap:6px;align-items:center;margin-bottom:7px}
.cbar-label{font-size:10px;color:var(--muted);text-align:right;text-transform:uppercase;letter-spacing:.3px}
.cbar{height:14px;border-radius:2px;background:#1a1a1a;overflow:hidden}
.cbar-r{direction:rtl}
.cbar-fill{height:100%;border-radius:2px;transition:width .5s}
.cbar-val{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-align:center}
.compare-bar-section{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:12px;margin-bottom:10px}
.empty-state{text-align:center;padding:50px;color:var(--muted)}
.empty-state .es-icon{font-size:40px;margin-bottom:10px}
.empty-state .es-text{font-size:13px}
.carga-alert{background:#1a0808;border:1px solid #5a1515;border-radius:4px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.carga-alert-icon{font-size:16px}
.carga-alert-text{font-size:11px;color:#e88;line-height:1.4}
.carga-alert-text strong{color:var(--red);font-family:'Barlow Condensed',sans-serif;font-size:13px}
@media(max-width:700px){.ctx-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">⚫ Botafogo · Stats Individuais 2026</div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="tabs">
      <button class="tab active" id="tab-btn-overview" onclick="switchTab('overview')" data-i18n="tab_overview">Visão Geral</button>

<script>



const POS_COLORS={
  'Zagueiro':'#3498db','Lateral D':'#e67e22','Lateral E':'#9b59b6',
  'Volante':'#e74c3c','Meia':'#27ae60','Ponta D':'#f39c12','Ponta E':'#1abc9c',
  'Atacante':'#e74c3c','Outros':'#7f8c8d'
};
const ALL_DETAIL_TABS=['tecnico','fisico','forma','consist','destaques','contextual','bench','jogos','ia'];

const players={};
WYSCOUT.forEach(r=>{
  if(!players[r.nome])players[r.nome]={nome:r.nome,pos:PLAYER_POS[r.nome]||'Outros',wy:[],fisio:[]};
  players[r.nome].wy.push(r);
});
FISIO.forEach(r=>{
  if(!players[r.nome])players[r.nome]={nome:r.nome,pos:PLAYER_POS[r.nome]||'Outros',wy:[],fisio:[]};
  // Calcular m/min = dist_total / minutos (intensidade de corrida)
  if(r.minutos_float>0) r.m_por_min = Math.round(r.dist_total / r.minutos_float * 100)/100;
  else r.m_por_min = null;
  players[r.nome].fisio.push(r);
});
Object.values(players).forEach(p=>{
  p.wy.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  p.fisio.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
});
const allPlayers=Object.values(players).sort((a,b)=>a.nome.localeCompare(b.nome));
let currentFilter='',currentPos='Todos',selectedPlayer=null,currentTab='overview',detailTab='tecnico';
let compareP1=null,compareP2=null,chartInstances={};

// ── MATH ──────────────────────────────────────────────────
// valid = jogos com >= MIN_MINUTES
function validGames(arr){return arr.filter(r=>r.valid!==false);}
function numArr(arr,key){return arr.map(r=>parseFloat(r[key])).filter(v=>!isNaN(v)&&v!=null);}
function avg(arr,key){const v=numArr(arr,key);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
// avgValid: usa apenas jogos >=45min; para fisio usa _p90, para wy normaliza internamente
function avgValidFisio(arr,key){
  const valid=validGames(arr);
  // m/min: média de dist_total/minutos por jogo (não usar _p90)
  if(key==='m_por_min'){
    const vals=valid.map(g=>g.m_por_min).filter(v=>v!=null&&!isNaN(v)&&v>0);
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  }
  const p90key=key+'_p90';
  const v=numArr(valid,p90key);
  if(v.length)return v.reduce((a,b)=>a+b,0)/v.length;
  // fallback: raw values from valid games
  const v2=numArr(valid,key);
  return v2.length?v2.reduce((a,b)=>a+b,0)/v2.length:0;
}
function avgValidWy(arr,key){
  const valid=validGames(arr);
  // per-90: sum(value)/sum(minutes)*90
  let totalVal=0,totalMin=0;
  valid.forEach(r=>{
    const v=parseFloat(r[key]),m=parseFloat(r.minutos_float||r.minutos||0);
    if(!isNaN(v)&&m>0){totalVal+=v;totalMin+=m;}
  });
  return totalMin>0?totalVal/totalMin*90:0;
}
function stddev(arr,key){const v=numArr(arr,key);if(v.length<2)return 0;const m=v.reduce((a,b)=>a+b,0)/v.length;return Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length);}
function stddevValid(arr,key,isFisio){
  const fn=isFisio?avgValidFisio:avgValidWy;
  const valid=validGames(arr);
  const m=fn(arr,key);if(!m||valid.length<2)return 0;
  const vals=isFisio
    ?numArr(valid,key+'_p90').length?numArr(valid,key+'_p90'):numArr(valid,key)
    :valid.map(r=>{const v=parseFloat(r[key]),mins=parseFloat(r.minutos_float||r.minutos||0);return mins>0?v/mins*90:0;}).filter(v=>!isNaN(v)&&v>0);
  if(vals.length<2)return 0;
  return Math.sqrt(vals.reduce((a,b)=>a+(b-m)**2,0)/vals.length);
}
function sum(arr,key){return numArr(arr,key).reduce((a,b)=>a+b,0);}
function consistScoreV(arr,key,isFisio){
  const m=isFisio?avgValidFisio(arr,key):avgValidWy(arr,key);
  if(!m)return null;
  const sd=stddevValid(arr,key,isFisio);
  const cv=sd/m;
  return Math.max(0,Math.round(100-cv*100));
}
function consistScore(arr,key){return consistScoreV(arr,key,false);}
function fmtDist(v){return v?(Math.round(v/100)/10).toFixed(1)+' km':'-';}
function fmtP90(v,key){
  if(v==null||isNaN(v))return '-';
  return key==='xG'?v.toFixed(2):key==='v_max'?v.toFixed(1):Math.round(v)+'';
}

function getCargaAlerts(p){
  const alerts=[];
  const validF=validGames(p.fisio);
  if(validF.length<2)return alerts;
  // Last valid game
  const last=validF[validF.length-1],prev=validF.slice(0,-1);
  // Use p90 values for fair comparison
  const lastDist=parseFloat(last.dist_total_p90||last.dist_total)||0;
  const lastCarga=parseFloat(last.carga_p90||last.carga)||0;
  const avgDist=avgValidFisio(prev,'dist_total');
  const avgCarga=avgValidFisio(prev,'carga');
  if(lastDist>0&&avgDist>0&&lastDist<avgDist*0.6)alerts.push({tipo:'queda',msg:`Dist/90 caiu ${Math.round((1-lastDist/avgDist)*100)}% vs média`});
  if(lastCarga>1200)alerts.push({tipo:'alto',msg:`Carga/90 elevada: ${Math.round(lastCarga)}`});
  if(lastCarga>0&&avgCarga>0&&lastCarga>avgCarga*1.4)alerts.push({tipo:'spike',msg:`Carga/90 +${Math.round((lastCarga/avgCarga-1)*100)}% vs média`});
  return alerts;
}
function getDestaques(p){
  const d=[];
  if(p.wy.length){
    const maxGol=[...p.wy].sort((a,b)=>(parseFloat(b.gols)||0)-(parseFloat(a.gols)||0))[0];
    if(parseFloat(maxGol.gols)>0)d.push({tipo:'gold',title:'Melhor jogo — Gols',val:maxGol.gols+' gol'+(maxGol.gols>1?'s':''),sub:maxGol.jogo,data:maxGol.data});
    const maxPass=[...p.wy].sort((a,b)=>(parseFloat(b.passes)||0)-(parseFloat(a.passes)||0))[0];
    if(parseFloat(maxPass.passes)>0)d.push({tipo:'blue',title:'Recorde de passes',val:maxPass.passes+' passes',sub:maxPass.jogo,data:maxPass.data});
    const maxDuelos=[...p.wy].sort((a,b)=>(parseFloat(b.duelos)||0)-(parseFloat(a.duelos)||0))[0];
    if(parseFloat(maxDuelos.duelos)>0)d.push({tipo:'gold',title:'Mais duelos num jogo',val:maxDuelos.duelos+' duelos',sub:maxDuelos.jogo,data:maxDuelos.data});
  }
  if(p.fisio.length){
    const maxDist=[...p.fisio].sort((a,b)=>(parseFloat(b.dist_total)||0)-(parseFloat(a.dist_total)||0))[0];
    if(parseFloat(maxDist.dist_total)>0)d.push({tipo:'blue',title:'Maior distância percorrida',val:fmtDist(parseFloat(maxDist.dist_total)),sub:maxDist.jogo||maxDist.data,data:maxDist.data});
    const maxVmax=[...p.fisio].sort((a,b)=>(parseFloat(b.v_max)||0)-(parseFloat(a.v_max)||0))[0];
    if(parseFloat(maxVmax.v_max)>0)d.push({tipo:'gold',title:'Velocidade máxima',val:parseFloat(maxVmax.v_max).toFixed(1)+' km/h',sub:maxVmax.jogo||maxVmax.data,data:maxVmax.data});
    const maxCarga=[...p.fisio].sort((a,b)=>(parseFloat(b.carga)||0)-(parseFloat(a.carga)||0))[0];
    if(parseFloat(maxCarga.carga)>0)d.push({tipo:'red',title:'Maior carga acumulada',val:Math.round(parseFloat(maxCarga.carga))+'',sub:maxCarga.jogo||maxCarga.data,data:maxCarga.data});
  }
  return d;
}

// ── SIDEBAR ───────────────────────────────────────────────
const posOrder=['Todos','Zagueiro','Lateral D','Lateral E','Volante','Meia','Ponta D','Ponta E','Atacante','Outros'];
function buildPosFilter(){
  const present=new Set(allPlayers.map(p=>p.pos).filter(Boolean));
  const sorted=posOrder.filter(p=>p==='Todos'||present.has(p));
  document.getElementById('posFilter').innerHTML=sorted.map(p=>`<button class="pos-btn${p==='Todos'?' active':''}" onclick="setPosFilter('${p}')">${p}</button>`).join('');
}
function setPosFilter(pos){currentPos=pos;document.querySelectorAll('.pos-btn').forEach(b=>b.classList.toggle('active',b.textContent===pos));renderPlayerList();}
function filterPlayers(q){currentFilter=q.toLowerCase();renderPlayerList();}
function renderPlayerList(){
  const filtered=allPlayers.filter(p=>(currentPos==='Todos'||p.pos===currentPos)&&p.nome.toLowerCase().includes(currentFilter));
  const countEl=document.getElementById('player-count');if(countEl)countEl.textContent=filtered.length+' jogadores';
  document.getElementById('playerList').innerHTML=filtered.map(p=>{
    const ini=p.nome.split(' ').slice(0,2).map(w=>w[0]).join('');
    const col=POS_COLORS[p.pos]||'#7f8c8d';
    const isActive=selectedPlayer&&selectedPlayer.nome===p.nome;
    const hasAlert=getCargaAlerts(p).length>0;
    return `<div class="player-item${isActive?' active':''}" onclick="selectPlayer(this.dataset.nome)" data-nome="${p.nome}">
      <div class="player-avatar" style="color:${col};background:${col}18;border:1.5px solid ${col}55;box-shadow:0 0 0 1px ${col}20">${ini}</div>
      <div style="flex:1;min-width:0">
        <div class="p-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.nome}</div>
        <div class="p-pos" style="color:${col}">${p.pos||''}</div>
      </div>
      ${hasAlert?'<span style="width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0"></span>':''}
    </div>`;
  }).join('');
}
function selectPlayer(nome){selectedPlayer=players[nome];renderPlayerList();switchTab('detail');renderDetail();}

// ── TABS ──────────────────────────────────────────────────
function switchTab(tab){
  currentTab=tab;
  const allTabs=['overview','detail','compare','reports'];
  document.querySelectorAll('.tab').forEach(t=>{
    const id=t.id.replace('tab-btn-','');
    t.classList.toggle('active',id===tab);
  });
  allTabs.forEach(t=>{const el=document.getElementById('tab-'+t);if(el)el.style.display=t===tab?'':'none';});
  // Sidebar: esconde no reports, mostra nas outras abas
  const sidebar=document.querySelector('.sidebar');

    sidebar.style.display='none';

  } else {
    sidebar.style.display='flex';
    content.style.position='';
    content.style.padding='14px';
    content.style.overflow='';
  }

  if(tab==='detail')selectedPlayer?renderDetail():(document.getElementById('tab-detail').innerHTML='<div class="empty-state"><div class="es-icon">👤</div><div class="es-text">Selecione um jogador na sidebar</div></div>');

function renderDForma(){
  const p=selectedPlayer,N=3;
  function formaSection(arr,metrics,title,isFisio){
    if(!arr.length)return '';
    const recent=arr.slice(-N);
    // For WY: compute p90; for fisio: use _p90 keys already in data
    function metricVal(games,key){
      if(isFisio){if(key==='m_por_min'){const v=games.map(g=>g.m_por_min).filter(v=>v!=null&&!isNaN(v)&&v>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}const v=numArr(games,key+'_p90');return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
      // WY p90: sum(raw)/sum(minutes)*90
      let tv=0,tm=0;games.forEach(r=>{const v=parseFloat(r[key]),m=parseFloat(r.minutos_float||r.minutos||0);if(!isNaN(v)&&m>0){tv+=v;tm+=m;}});
      return tm>0?tv/tm*90:0;
    }
    const cards=metrics.map(m=>{
      const ra=metricVal(recent,m.key),sa=metricVal(arr,m.key);
      if(!sa&&!ra)return '';
      const diff=sa?((ra-sa)/sa*100):0;
      const tc=diff>5?'#27ae60':diff<-5?'#e74c3c':'#c9a227';
      const arrow=diff>5?'▲':diff<-5?'▼':'●';
      const dots=arr.slice(-5).map((g,i,a)=>{
        const v=parseFloat(g[m.key])||0,r=sa>0?v/sa:0,inR=i>=a.length-N;
        const c=r>=1.1?'#27ae60':r>=0.8?'#c9a227':'#e74c3c';
        return '<div class="forma-game-dot" style="background:'+c+(inR?'':'40')+';color:'+(inR?'#111':'transparent')+'">'+( Math.round(v)||'')+'</div>';
      }).join('');
      const fv=m.key==='dist_total'?fmtDist(ra):m.key==='xG'||m.key==='m_por_min'?ra.toFixed(1):Math.round(ra);
      const sv=m.key==='dist_total'?fmtDist(sa):m.key==='xG'||m.key==='m_por_min'?sa.toFixed(1):Math.round(sa);
      return '<div class="forma-card"><div class="forma-metric">'+m.label+'</div><div class="forma-vals"><div class="forma-recent" style="color:'+tc+'">'+fv+'</div><div class="forma-avg">méd '+sv+'</div><div class="forma-arrow" style="color:'+tc+'">'+arrow+' '+Math.abs(Math.round(diff))+'%</div></div><div class="forma-games">'+dots+'</div></div>';
    }).filter(Boolean).join('');
    return cards?'<div class="section-title">'+title+' — últimos '+N+' vs média</div><div class="forma-grid">'+cards+'</div>':'';
  }
  const last=p.wy.length?p.wy[p.wy.length-1]:null;
  const lastHdr=last?`<div style="background:var(--card);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:12px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Último jogo</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700">${last.jogo}</div><div style="font-size:11px;color:var(--muted)">${last.data||''} · ${last.competicao||''}</div></div>`:'';
  const wyM=[{key:'passes',label:'Passes'},{key:'duelos',label:'Duelos'},{key:'gols',label:'Gols'},{key:'assistencias',label:'Assist.'},{key:'recuperacoes',label:'Recuperações'},{key:'xG',label:'xG'}];
  const fiM=[{key:'m_por_min',label:'M/min'},{key:'hsr_p90',label:'HSR/90'},{key:'carga_p90',label:'Carga/90'},{key:'sprints_p90',label:'Sprints/90'}];
  const validFisio=validGames(p.fisio);
  const validWyForma=validGames(p.wy);
  document.getElementById('detail-forma').innerHTML=lastHdr+formaSection(validWyForma,wyM,'Wyscout (≥45min, /90min)',false)+formaSection(validFisio,fiM,'BFR (≥45min, /90min)',true)||'<div class="empty-state"><div class="es-text">Dados insuficientes</div></div>';
}

function renderDConsist(){
  const p=selectedPlayer;
  function cSection(arr,metrics,title){
    if(arr.length<3)return '<div style="color:var(--muted);font-size:11px;padding:10px 0">Mínimo 3 jogos ('+arr.length+' disponíveis)</div>';
    const cards=metrics.map(m=>{
      const vals=numArr(arr,m.key);if(!vals.length)return '';
      const mean=vals.reduce((a,b)=>a+b,0)/vals.length;if(!mean)return '';
      const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
      const cv=sd/mean,score=Math.max(0,Math.round(100-cv*100));
      const bc=score>=75?'#27ae60':score>=50?'#c9a227':'#e74c3c';
      return '<div class="consist-card"><div class="consist-label">'+m.label+'</div><div class="consist-bar-wrap"><div class="consist-bar" style="width:'+score+'%;background:'+bc+'"></div></div><div class="consist-stats"><span style="color:'+bc+';font-weight:700">'+score+'/100</span><span>DP: '+(m.key==='dist_total'?Math.round(sd):m.key==='xG'?sd.toFixed(2):Math.round(sd))+'</span><span>CV: '+Math.round(cv*100)+'%</span></div></div>';
    }).filter(Boolean).join('');
    return cards?'<div class="section-title">'+title+'</div><div class="consist-grid">'+cards+'</div>':'';
  }

// ── CONTEXTUAL (FASE 2) ───────────────────────────────────
function renderDContextual(){
  const p=selectedPlayer;
  if(!p.wy.length){document.getElementById('detail-contextual').innerHTML='<div class="empty-state"><div class="es-text">Sem dados Wyscout</div></div>';return;}

  // Group games by context
  const validWyCtx=validGames(p.wy);
  if(!validWyCtx.length){document.getElementById('detail-contextual').innerHTML='<div class="empty-state"><div class="es-text">Sem jogos válidos (≥45min)</div></div>';return;}
  const groups={
    local:{Casa:validWyCtx.filter(g=>g.local==='Casa'),Fora:validWyCtx.filter(g=>g.local==='Fora')},
    result:{V:validWyCtx.filter(g=>g.result==='V'),E:validWyCtx.filter(g=>g.result==='E'),D:validWyCtx.filter(g=>g.result==='D')},
    comp:{}
  };
  // For contextual, use p90 averages
  function avgCtx(arr,key){
    let tv=0,tm=0;
    arr.forEach(r=>{const v=parseFloat(r[key]),m=parseFloat(r.minutos_float||r.minutos||0);if(!isNaN(v)&&m>0){tv+=v;tm+=m;}});
    return tm>0?tv/tm*90:0;
  }
  validWyCtx.forEach(g=>{const cg=g.comp_group||'Outros';if(!groups.comp[cg])groups.comp[cg]=[];groups.comp[cg].push(g);});

  const ctxMetrics=[
    {key:'passes',label:'Passes'},{key:'duelos',label:'Duelos'},
    {key:'recuperacoes',label:'Recuperações'},{key:'xG',label:'xG'},
    {key:'gols',label:'Gols'},{key:'assistencias',label:'Assist.'},
  ];

  // ── CASA vs FORA ──
  const casaGames=groups.local.Casa||[],foraGames=groups.local.Fora||[];
  const casaRows=ctxMetrics.map(m=>{
    const vc=avgCtx(casaGames,m.key),vf=avgCtx(foraGames,m.key);
    if(!vc&&!vf)return '';
    const fmtV=v=>m.key==='xG'?v.toFixed(2):Math.round(v);
    const diff=vc&&vf?(((vc-vf)/vf)*100):0;
    const dc=diff>5?'var(--green)':diff<-5?'var(--red)':'var(--muted)';
    return '<div class="ctx-metric-row"><div class="ctx-metric-label">'+m.label+'</div><div class="ctx-metric-vals"><span style="color:#5b9bd5">'+fmtV(vc)+'</span><span style="color:var(--muted);font-size:11px">vs</span><span style="color:#f39c12">'+fmtV(vf)+'</span><span style="color:'+dc+';font-size:11px">'+(diff>0?'+':'')+Math.round(diff)+'%</span></div></div>';
  }).filter(Boolean).join('');

  // ── RESULTADO ──
  const resultRows=ctxMetrics.map(m=>{
    const vv=avgCtx(groups.result.V||[],m.key),ve=avgCtx(groups.result.E||[],m.key),vd=avgCtx(groups.result.D||[],m.key);
    if(!vv&&!ve&&!vd)return '';
    const fmtV=v=>m.key==='xG'?v.toFixed(2):Math.round(v);
    return '<div class="ctx-metric-row"><div class="ctx-metric-label">'+m.label+'</div><div class="ctx-metric-vals"><span style="color:var(--green)">'+fmtV(vv)+'</span><span style="color:var(--gold)">'+fmtV(ve)+'</span><span style="color:var(--red)">'+fmtV(vd)+'</span></div></div>';
  }).filter(Boolean).join('');

  // ── COMPETIÇÕES ──
  const compKeys=Object.keys(groups.comp).sort();
  const compRows=ctxMetrics.map(m=>{
    const vals=compKeys.map(ck=>avg(groups.comp[ck],m.key));
    if(vals.every(v=>!v))return '';
    const fmtV=v=>m.key==='xG'?v.toFixed(2):Math.round(v);
    const cells=compKeys.map((ck,i)=>'<span style="color:var(--muted);font-size:10px">'+ck.substring(0,8)+': </span><span style="font-weight:700">'+fmtV(vals[i])+'</span>').join(' · ');
    return '<div class="ctx-metric-row" style="flex-direction:column;align-items:flex-start;gap:2px"><div class="ctx-metric-label">'+m.label+'</div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:13px">'+cells+'</div></div>';
  }).filter(Boolean).join('');

  // ── MINI RADAR CHART ──
  const radarLabels=['Passes','Duelos','Recup.','xG','Remates','Dribles'];
  const radarKeys=['passes','duelos','recuperacoes','xG','remates','dribbles'];
  const toRadarData=(games)=>{
    // Use p90 averages for fair comparison
    const allAvgs=radarKeys.map(k=>avgValidWy(validWyCtx,k));
    return radarKeys.map((k,i)=>{const a=avgValidWy(games,k),base=allAvgs[i];return base>0?Math.min(200,Math.round(a/base*100)):100;});
  };

  document.getElementById('detail-contextual').innerHTML=`
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Valores por 90 min · somente jogos ≥${MIN_MINUTES}min (${validWyCtx.length} jogos). Casa vs Fora: <span style="color:#5b9bd5">■ Casa</span> · <span style="color:#f39c12">■ Fora</span> &nbsp;|&nbsp; Resultado: <span style="color:var(--green)">V</span> · <span style="color:var(--gold)">E</span> · <span style="color:var(--red)">D</span></div>
    <div class="ctx-grid">
      <div class="ctx-card">
        <div class="ctx-card-title">
          Casa vs Fora
          <div style="display:flex;gap:6px">
            <span class="ctx-badge" style="background:#1e2a3a;color:#5b9bd5">Casa ${casaGames.length}j</span>
            <span class="ctx-badge" style="background:#2a1e0a;color:#f39c12">Fora ${foraGames.length}j</span>
          </div>
        </div>
        ${casaRows||'<div style="color:var(--muted);font-size:11px">Dados insuficientes</div>'}
      </div>
      <div class="ctx-card">
        <div class="ctx-card-title">
          Por resultado
          <div style="display:flex;gap:4px">
            <span class="ctx-badge r-V">V ${(groups.result.V||[]).length}</span>
            <span class="ctx-badge r-E">E ${(groups.result.E||[]).length}</span>
            <span class="ctx-badge r-D">D ${(groups.result.D||[]).length}</span>
          </div>
        </div>
        ${resultRows||'<div style="color:var(--muted);font-size:11px">Dados insuficientes</div>'}
      </div>
      <div class="ctx-card">
        <div class="ctx-card-title">Por competição</div>
        ${compRows||'<div style="color:var(--muted);font-size:11px">Dados insuficientes</div>'}
      </div>
    </div>
    <div class="chart-section">
      <div class="chart-title">Radar — Performance indexada (100 = média da temporada)</div>
      <div class="chart-container" style="height:240px"><canvas id="radarCtx"></canvas></div>
    </div>`;

  // Radar chart
  destroyChart('radarCtx');
  const rdCasa=toRadarData(casaGames),rdFora=toRadarData(foraGames);
  chartInstances['radarCtx']=new Chart(document.getElementById('radarCtx').getContext('2d'),{
    type:'radar',
    data:{labels:radarLabels,datasets:[
      {label:'Casa',data:rdCasa,borderColor:'#5b9bd5',backgroundColor:'rgba(91,155,213,.15)',borderWidth:2,pointBackgroundColor:'#5b9bd5',pointRadius:3},
      {label:'Fora',data:rdFora,borderColor:'#f39c12',backgroundColor:'rgba(243,156,18,.15)',borderWidth:2,pointBackgroundColor:'#f39c12',pointRadius:3}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{r:{angleLines:{color:'rgba(150,150,150,0.25)'},grid:{color:'rgba(150,150,150,0.2)'},ticks:{color:'#888',backdropColor:'rgba(20,20,20,0.6)',font:{size:8},stepSize:50},pointLabels:{color:'#bbb',font:{size:10,weight:'600'}},suggestedMin:0,suggestedMax:200}},
      plugins:{legend:{labels:{color:'#bbb',font:{size:11},boxWidth:14,padding:12}}}}
  });
}

function renderDBench(){
  const p=selectedPlayer;
  const benchMetrics=[
    {key:'passes',label:'Passes/90'},
    {key:'duelos',label:'Duelos/90'},
    {key:'duelos_ganhos',label:'Duelos Ganhos/90'},
    {key:'recuperacoes',label:'Recuperações/90'},
    {key:'interceptacoes',label:'Interceptações/90'},
    {key:'perdas',label:'Perdas/90'},
    {key:'remates',label:'Remates/90'},
    {key:'xG',label:'xG/90'},
    {key:'dribbles',label:'Dribbles/90'},
    {key:'passes_certos',label:'Passes Certos/90'},
  ];
  const pBench=BENCH_DATA[p.nome];
  if(!pBench){document.getElementById('detail-bench').innerHTML='<div class="empty-state"><div class="es-text">Dados insuficientes para benchmarking</div></div>';return;}

  // Overall score
  const scores=benchMetrics.map(m=>{
    const bd=pBench[m.key];
    return bd?bd.pct:null;
  }).filter(v=>v!==null);
  const overallScore=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  const overallColor=overallScore>=75?'#27ae60':overallScore>=50?'#c9a227':'#e74c3c';

  const cards=benchMetrics.map(m=>{
    const bd=pBench[m.key];if(!bd)return '';
    const pct=bd.pct,val=bd.avg_p90;
    const bc=pct>=75?'#27ae60':pct>=50?'#c9a227':'#e74c3c';
    // invert "perdas" — lower is better
    const isInverse=m.key==='perdas';
    const adjPct=isInverse?100-pct:pct;
    const adjBc=adjPct>=75?'#27ae60':adjPct>=50?'#c9a227':'#e74c3c';
    const fmtVal=m.key==='xG'?val.toFixed(2):Math.round(val);
    return '<div class="bench-card"><div class="bench-label">'+m.label+(isInverse?' ↓ menor = melhor':'')+'</div><div class="bench-bar-wrap"><div class="bench-bar-bg"><div class="bench-bar-fill" style="width:'+adjPct+'%;background:'+adjBc+'"></div></div><div class="bench-val" style="color:'+adjBc+'">'+fmtVal+'</div></div><div class="bench-pct"><div class="bench-pct-val" style="color:'+adjBc+'">Percentil '+(isInverse?100-pct:pct)+'%</div><div class="bench-rank" style="font-size:10px">'+(adjPct>=75?'Top 25%':adjPct>=50?'Acima da méd':'Abaixo da méd')+'</div></div></div>';
  }).filter(Boolean).join('');

  document.getElementById('detail-bench').innerHTML=`
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:5px">
      <div class="pct-ring" style="color:${overallColor};border-color:${overallColor}">${overallScore}</div>
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700">Score geral no elenco</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Percentil médio em ${scores.length} métricas · Base: todos os jogadores com ≥30 min</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Posição percentual por 90 min, somente jogos ≥${MIN_MINUTES}min. Percentil 90% = melhor que 90% do elenco nessa métrica.</div>
    <div class="bench-grid">${cards}</div>`;

  // Spider chart
  setTimeout(()=>{
    const radarLabels=benchMetrics.filter(m=>pBench[m.key]).map(m=>m.label.replace('/jogo',''));
    const radarData=benchMetrics.filter(m=>pBench[m.key]).map(m=>{
      const isInverse=m.key==='perdas';
      return isInverse?100-pBench[m.key].pct:pBench[m.key].pct;
    });
    if(radarLabels.length>=3){
      destroyChart('benchRadar');
      const container=document.createElement('div');container.className='chart-section';container.style.marginTop='12px';
      container.innerHTML=`<div class="chart-title">Perfil de performance no elenco</div><div class="chart-container" style="height:250px"><canvas id="benchRadar"></canvas></div>`;
      document.getElementById('detail-bench').appendChild(container);
      chartInstances['benchRadar']=new Chart(document.getElementById('benchRadar').getContext('2d'),{
        type:'radar',
        data:{labels:radarLabels,datasets:[{label:p.nome,data:radarData,borderColor:'#c9a227',backgroundColor:'rgba(201,162,39,.12)',borderWidth:2,pointBackgroundColor:'#c9a227',pointRadius:4}]},
        options:{responsive:true,maintainAspectRatio:false,
          scales:{r:{angleLines:{color:'rgba(150,150,150,0.25)'},grid:{color:'rgba(150,150,150,0.2)'},ticks:{color:'#888',backdropColor:'rgba(20,20,20,0.6)',font:{size:8},stepSize:25},pointLabels:{color:'#bbb',font:{size:10,weight:'600'}},min:0,max:100}},
          plugins:{legend:{display:false}}}
      });
    }
  },100);
}

  if(compareP2){const s=document.getElementById('cmp-p2');if(s)s.value=compareP2.nome;}

}

function onCompareChange(){
  const n1=document.getElementById('cmp-p1')?.value;
  const n2=document.getElementById('cmp-p2')?.value;
  compareP1 = n1?players[n1]:null;
  compareP2 = n2?players[n2]:null;
  buildCompareCharts();
}

function buildCompareCharts(){
  const container = document.getElementById('cmp-content');
  if(!compareP1||!compareP2){
    container.innerHTML='<div class="empty-state"><div class="es-icon">⚖️</div><div class="es-text">Selecione dois jogadores</div></div>';
    return;
  }
  const type = document.getElementById('cmp-type')?.value||'tecnico';
  const p1=compareP1, p2=compareP2;
  const c1=POS_COLORS[p1.pos]||'#c9a227', c2=POS_COLORS[p2.pos]||'#2980b9';
  const defaults = getDefaultMetrics(p1,p2);

  let metricSet, isFisio=false;
  if(type==='fisico'){
    metricSet = defaults.fisico.map(k=>FISIO_METRICS_ALL.find(m=>m.key===k)||{key:k,label:k});
    isFisio=true;
  } else if(type==='todos'){
    metricSet = ALL_METRICS;
  } else {
    metricSet = defaults.tecnico.map(k=>ALL_METRICS.find(m=>m.key===k)||{key:k,label:k});
  }

  // Compute p90 values per player per metric
  function getP90(player, key, fisio){
    if(fisio){
      return avgValidFisio(player.fisio, key);
    }
    return avgValidWy(player.wy, key);
  }

  const labels = metricSet.map(m=>m.label);
  const vals1 = metricSet.map(m=>Math.round(getP90(p1,m.key,isFisio)*100)/100);
  const vals2 = metricSet.map(m=>Math.round(getP90(p2,m.key,isFisio)*100)/100);

  const posLabel = type==='tecnico'
    ? ' — padrão para '+(p1.pos||p2.pos||'posição')
    : type==='fisico' ? ' — físico/90' : ' — todas as métricas';

  const noteText = isFisio
    ? 'Valores por 90 min · BFR (≥45min)'
    : 'Valores por 90 min · Wyscout (≥45min) · padrão para '+(p1.pos||p2.pos||'posição selecionada');

  // Metric selector for custom
  container.innerHTML = `
    <div style="font-size:10px;color:var(--muted);margin-bottom:10px;padding:5px 8px;background:#1a1500;border:1px solid #333;border-radius:3px">
      ⓘ ${noteText}
    </div>
    <div style="display:flex;gap:16px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:14px;height:14px;border-radius:3px;background:${c1}"></div>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:${c1}">${p1.nome}</span>
        <span style="font-size:10px;color:var(--muted)">${p1.pos||''}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:14px;height:14px;border-radius:3px;background:${c2}"></div>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:${c2}">${p2.nome}</span>
        <span style="font-size:10px;color:var(--muted)">${p2.pos||''}</span>
      </div>
      <span style="font-size:10px;color:var(--muted);margin-left:auto">${metricSet.length} métricas${posLabel}</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="chart-section" style="margin-bottom:0">
        <div class="chart-title" style="margin-bottom:8px">Barras agrupadas</div>
        <div style="position:relative;height:${Math.max(200, metricSet.length*30)}px"><canvas id="cmpBarChart"></canvas></div>
      </div>
      <div class="chart-section" style="margin-bottom:0">
        <div class="chart-title" style="margin-bottom:8px">Radar comparativo</div>
        <div style="position:relative;height:${Math.max(200, metricSet.length*30)}px"><canvas id="cmpRadarChart"></canvas></div>
      </div>
    </div>`;

  // Destroy old charts
  if(cmpChart1){cmpChart1.destroy();cmpChart1=null;}
  if(cmpChart2){cmpChart2.destroy();cmpChart2=null;}

  // ── GROUPED BAR (horizontal) ─────────────────────────────
  setTimeout(()=>{
    const ctxBar = document.getElementById('cmpBarChart');
    if(!ctxBar)return;
    cmpChart1 = new Chart(ctxBar.getContext('2d'),{
      type:'bar',
      data:{
        labels,
        datasets:[
          {label:p1.nome,data:vals1,backgroundColor:c1+'cc',borderColor:c1,borderWidth:1},
          {label:p2.nome,data:vals2,backgroundColor:c2+'cc',borderColor:c2,borderWidth:1},
        ]
      },
      options:{
        indexAxis:'y',
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'#aaa',font:{size:11}}},
          tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.raw+'/90'}}},
        scales:{
          x:{ticks:{color:'#888',font:{size:10},padding:6},grid:{color:'rgba(255,255,255,0.08)',drawBorder:false}},
          y:{ticks:{color:'#999',font:{size:10},padding:6},grid:{color:'rgba(255,255,255,0.08)',drawBorder:false}}
        }
      }
    });

    // ── RADAR ──────────────────────────────────────────────
    const ctxRadar = document.getElementById('cmpRadarChart');
    if(!ctxRadar)return;
    // Normalize to 0-100 scale (% of max between the two)
    const radarVals1 = metricSet.map((_,i)=>{
      const mx=Math.max(vals1[i],vals2[i],0.001);
      return Math.round(vals1[i]/mx*100);
    });
    const radarVals2 = metricSet.map((_,i)=>{
      const mx=Math.max(vals1[i],vals2[i],0.001);
      return Math.round(vals2[i]/mx*100);
    });
    // Shorten labels for radar
    const radarLabels = labels.map(l=>l.length>12?l.substring(0,11)+'…':l);
    cmpChart2 = new Chart(ctxRadar.getContext('2d'),{
      type:'radar',
      data:{
        labels:radarLabels,
        datasets:[
          {label:p1.nome,data:radarVals1,borderColor:c1,backgroundColor:c1+'25',borderWidth:2,pointBackgroundColor:c1,pointRadius:3},
          {label:p2.nome,data:radarVals2,borderColor:c2,backgroundColor:c2+'25',borderWidth:2,pointBackgroundColor:c2,pointRadius:3},
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},
          tooltip:{callbacks:{label:ctx=>{const i=ctx.dataIndex;const raw=ctx.datasetIndex===0?vals1[i]:vals2[i];return ctx.dataset.label+': '+raw+'/90 ('+ctx.raw+'%)';} }}},
        scales:{r:{
          grid:{color:'rgba(255,255,255,0.10)',drawBorder:false},
          ticks:{color:'#555',backdropColor:'transparent',font:{size:8},stepSize:25},
          pointLabels:{color:'#888',font:{size:9}},
          min:0,max:100
        }}
      }
    });
  },50);
}


// ── RESUMO EXECUTIVO ─────────────────────────────────────
function renderDIA(){
  const p = selectedPlayer;
  if(!p){ document.getElementById('detail-ia').innerHTML='<div class="empty-state"><div class="es-text">Nenhum jogador selecionado</div></div>'; return; }

  const vWy  = validGames(p.wy);
  const vFis = validGames(p.fisio);

  // ── helpers ──────────────────────────────────────────
  function p90wy(key){ let tv=0,tm=0; vWy.forEach(g=>{const v=parseFloat(g[key]),m=parseFloat(g.minutos_float||g.minutos||0);if(!isNaN(v)&&m>0){tv+=v;tm+=m;}}); return tm>0?tv/tm*90:0; }
  function avgFis(key){ const vals=vFis.map(g=>parseFloat(g[key+'_p90']||g[key])||0).filter(v=>v>0); return vals.length?vals.reduce((a,b)=>a+b)/vals.length:0; }
  function cvScore(arr,key,isFis){
    const vals=arr.map(g=>isFis?(parseFloat(g[key+'_p90']||g[key])||0):(parseFloat(g[key])||0)).filter(v=>v>0);
    if(vals.length<3)return null;
    const mean=vals.reduce((a,b)=>a+b)/vals.length;
    if(!mean)return null;
    const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
    return Math.max(0,Math.round(100-sd/mean*100));
  }
  function trend(arr,key,isFis,N=3){
    const full=arr.map(g=>isFis?(parseFloat(g[key+'_p90']||g[key])||0):(parseFloat(g[key])||0));
    if(full.length<N+1)return 0;
    const recent=full.slice(-N).reduce((a,b)=>a+b)/N;
    const prev=full.slice(0,-N).reduce((a,b)=>a+b)/full.slice(0,-N).length;
    return prev>0?(recent-prev)/prev*100:0;
  }

  const items = []; // {group, icon, label, type:'pos'|'neg'|'ok', detail}

  // ── 1. TÉCNICO ────────────────────────────────────────
  const passes    = p90wy('passes');
  const passAcc   = (function(){ let ok=0,tot=0; vWy.forEach(g=>{ok+=parseFloat(g.passes_certos)||0; tot+=parseFloat(g.passes)||0;}); return tot>0?Math.round(ok/tot*100):0; })();
  const duelos    = p90wy('duelos');
  const duelosW   = (function(){ let ok=0,tot=0; vWy.forEach(g=>{ok+=parseFloat(g.duelos_ganhos)||0; tot+=parseFloat(g.duelos)||0;}); return tot>0?Math.round(ok/tot*100):0; })();
  const recup     = p90wy('recuperacoes');
  const perdas    = p90wy('perdas');
  const dribbles  = p90wy('dribbles');
  const dribleAcc = (function(){ let ok=0,tot=0; vWy.forEach(g=>{ok+=parseFloat(g.dribbles_sucesso)||0; tot+=parseFloat(g.dribbles)||0;}); return tot>0?Math.round(ok/tot*100):0; })();
  const gols      = p.wy.reduce((s,g)=>s+(parseFloat(g.gols)||0),0);
  const asts      = p.wy.reduce((s,g)=>s+(parseFloat(g.assistencias)||0),0);
  const xg        = p90wy('xG');
  const remates   = p90wy('remates');
  const cvPass    = cvScore(vWy,'passes',false);
  const cvDuel    = cvScore(vWy,'duelos',false);
  const trendPass = trend(vWy,'passes',false);
  const trendDuel = trend(vWy,'duelos',false);

  // passes
  if(passAcc>=85) items.push({group:'Técnico',icon:'⚽',label:'Precisão de passes alta ('+passAcc+'%)',type:'pos',detail:'Média de '+Math.round(passes)+' passes/90'});
  else if(passAcc<70) items.push({group:'Técnico',icon:'⚽',label:'Precisão de passes baixa ('+passAcc+'%)',type:'neg',detail:'Média de '+Math.round(passes)+' passes/90'});

  // duelos
  if(duelosW>=55) items.push({group:'Técnico',icon:'🤼',label:'Taxa de duelos ganhos elevada ('+duelosW+'%)',type:'pos',detail:Math.round(duelos)+' duelos/90'});
  else if(duelosW<40) items.push({group:'Técnico',icon:'🤼',label:'Taxa de duelos ganhos baixa ('+duelosW+'%)',type:'neg',detail:Math.round(duelos)+' duelos/90'});

  // recuperações vs perdas
  if(recup>0 && perdas>0){
    const ratio=recup/perdas;
    if(ratio>=1.5) items.push({group:'Técnico',icon:'🔄',label:'Boa relação recuperações/perdas ('+ratio.toFixed(1)+'x)',type:'pos',detail:Math.round(recup)+' rec/90 · '+Math.round(perdas)+' perd/90'});
    else if(ratio<0.8) items.push({group:'Técnico',icon:'🔄',label:'Relação recuperações/perdas negativa ('+ratio.toFixed(1)+'x)',type:'neg',detail:Math.round(recup)+' rec/90 · '+Math.round(perdas)+' perd/90'});
  }

  // dribbles
  if(dribbles>=2 && dribleAcc>=55) items.push({group:'Técnico',icon:'🏃',label:'Dribble eficiente ('+dribleAcc+'% sucesso)',type:'pos',detail:dribbles.toFixed(1)+' tentativas/90'});
  else if(dribbles>=2 && dribleAcc<35) items.push({group:'Técnico',icon:'🏃',label:'Baixa taxa de dribble ('+dribleAcc+'% sucesso)',type:'neg',detail:dribbles.toFixed(1)+' tentativas/90'});

  // gols/asts
  if(gols>0||asts>0){
    if(gols+asts>=5) items.push({group:'Técnico',icon:'🎯',label:'Participação ofensiva expressiva',type:'pos',detail:gols+' gols + '+asts+' assists na temporada'});
    else if(xg>0.15) items.push({group:'Técnico',icon:'🎯',label:'xG/90 relevante ('+xg.toFixed(2)+')',type:'ok',detail:Math.round(remates)+' remates/90'});
  }

  // tendência técnica
  if(trendPass>10) items.push({group:'Técnico',icon:'📈',label:'Passe em alta nos últimos 3 jogos (+'+Math.round(trendPass)+'%)',type:'pos',detail:''});
  else if(trendPass<-15) items.push({group:'Técnico',icon:'📉',label:'Queda de participação técnica nos últimos 3 jogos ('+Math.round(trendPass)+'%)',type:'neg',detail:''});

  // ── 2. FÍSICO ────────────────────────────────────────
  const dist    = avgFis('dist_total');
  const mPerMin = vFis.length?vFis.map(g=>g.m_por_min||0).filter(v=>v>0).reduce((a,b,_,arr)=>a+b/arr.length,0):0;
  const hsr     = avgFis('hsr');
  const carga   = avgFis('carga');
  const sprints = avgFis('sprints');
  const vmax    = vFis.length?Math.max(...vFis.map(g=>parseFloat(g.v_max)||0)):0;
  // trend m/min: últimos 3 vs anteriores
  const trendMperMin=(function(){
    if(vFis.length<5) return 0;
    const vals=vFis.map(g=>g.m_por_min||0).filter(v=>v>0);
    if(vals.length<4) return 0;
    const recent=vals.slice(-3).reduce((a,b)=>a+b,0)/3;
    const prev=vals.slice(0,-3).reduce((a,b)=>a+b,0)/vals.slice(0,-3).length;
    return prev>0?(recent-prev)/prev*100:0;
  })();
  const trendDist=trend(vFis,'dist_total',true);
  const trendCarg=trend(vFis,'carga',true);

  if(vFis.length>=3){
    // M/min — métrica principal de intensidade
    if(mPerMin>=95) items.push({group:'Físico',icon:'🏃',label:'Intensidade alta ('+mPerMin.toFixed(1)+' m/min)',type:'pos',detail:'Acima da referência de 95 m/min'});
    else if(mPerMin>=80 && mPerMin<95) items.push({group:'Físico',icon:'🏃',label:'Intensidade moderada ('+mPerMin.toFixed(1)+' m/min)',type:'ok',detail:'Referência: ≥95 m/min = alta intensidade'});
    else if(mPerMin>0 && mPerMin<80) items.push({group:'Físico',icon:'🏃',label:'Intensidade baixa ('+mPerMin.toFixed(1)+' m/min)',type:'neg',detail:'Abaixo de 80 m/min — pode indicar baixa demanda ou fadiga'});

    if(trendMperMin<-10) items.push({group:'Físico',icon:'📉',label:'Queda de intensidade nos últimos 3 jogos ('+Math.round(trendMperMin)+'%)',type:'neg',detail:'m/min em queda — monitorar fadiga'});
    else if(trendMperMin>10) items.push({group:'Físico',icon:'📈',label:'Intensidade em alta nos últimos 3 jogos (+'+Math.round(trendMperMin)+'%)',type:'pos',detail:''});

    if(hsr>=400) items.push({group:'Físico',icon:'⚡',label:'HSR elevado ('+Math.round(hsr)+'m/90)',type:'pos',detail:'Boa cobertura em alta velocidade'});
    else if(hsr>0 && hsr<200) items.push({group:'Físico',icon:'⚡',label:'HSR baixo ('+Math.round(hsr)+'m/90)',type:'neg',detail:'Pouca cobertura em alta velocidade'});

    if(vmax>=30) items.push({group:'Físico',icon:'🚀',label:'Velocidade máxima alta ('+vmax.toFixed(1)+' km/h)',type:'pos',detail:''});

    if(carga>1100) items.push({group:'Físico',icon:'⚠️',label:'Carga/90 elevada ('+Math.round(carga)+')',type:'neg',detail:'Monitorar risco de fadiga'});
    else if(carga>0 && carga<600) items.push({group:'Físico',icon:'📊',label:'Carga/90 baixa ('+Math.round(carga)+')',type:'ok',detail:'Jogador com menor demanda de esforço'});

    if(trendCarg>30) items.push({group:'Físico',icon:'🔴',label:'Pico de carga nos últimos jogos (+'+Math.round(trendCarg)+'%)',type:'neg',detail:'Atenção à gestão de esforço'});
  } else if(p.fisio.length===0){
    items.push({group:'Físico',icon:'📭',label:'Sem dados BFR disponíveis',type:'ok',detail:''});
  } else {
    items.push({group:'Físico',icon:'⏳',label:'Poucos jogos BFR com ≥45min ('+vFis.length+')',type:'ok',detail:'Análise física limitada'});
  }

  // ── 3. FORMA RECENTE ─────────────────────────────────
  const N=3;
  if(vWy.length>=N+2){
    const recentWy=vWy.slice(-N), prevWy=vWy.slice(0,-N);
    function wyAvg(arr,k){let tv=0,tm=0;arr.forEach(g=>{const v=parseFloat(g[k]),m=parseFloat(g.minutos_float||g.minutos||0);if(!isNaN(v)&&m>0){tv+=v;tm+=m;}});return tm>0?tv/tm*90:0;}
    const rPass=wyAvg(recentWy,'passes'), pPass=wyAvg(prevWy,'passes');
    const rDuel=wyAvg(recentWy,'duelos'), pDuel=wyAvg(prevWy,'duelos');
    const rRec =wyAvg(recentWy,'recuperacoes'), pRec=wyAvg(prevWy,'recuperacoes');

    const metsTrend=[];
    if(pPass>0){ const d=(rPass-pPass)/pPass*100; if(Math.abs(d)>12) metsTrend.push({lbl:'passes',d}); }
    if(pDuel>0){ const d=(rDuel-pDuel)/pDuel*100; if(Math.abs(d)>12) metsTrend.push({lbl:'duelos',d}); }
    if(pRec >0){ const d=(rRec-pRec)/pRec*100;   if(Math.abs(d)>12) metsTrend.push({lbl:'recuperações',d}); }

    const ups  =metsTrend.filter(m=>m.d>0);
    const downs=metsTrend.filter(m=>m.d<0);
    if(ups.length)   items.push({group:'Forma Recente',icon:'🔥',label:'Em alta: '+ups.map(m=>m.lbl+' (+'+Math.round(m.d)+'%)').join(', '),type:'pos',detail:'Comparando últ. '+N+' jogos vs média anterior'});
    if(downs.length) items.push({group:'Forma Recente',icon:'❄️',label:'Em queda: '+downs.map(m=>m.lbl+' ('+Math.round(m.d)+'%)').join(', '),type:'neg',detail:'Comparando últ. '+N+' jogos vs média anterior'});
    if(!ups.length&&!downs.length) items.push({group:'Forma Recente',icon:'➡️',label:'Forma estável nos últimos 3 jogos',type:'ok',detail:'Variações dentro da margem normal'});

    // resultado nos últimos 3
    const recentResults=p.wy.slice(-N).map(g=>g.result);
    const wins=recentResults.filter(r=>r==='V').length;
    const losses=recentResults.filter(r=>r==='D').length;
    if(wins>=2) items.push({group:'Forma Recente',icon:'🏆',label:wins+' vitórias nos últimos 3 jogos',type:'pos',detail:recentResults.join(' · ')});
    else if(losses>=2) items.push({group:'Forma Recente',icon:'⚠️',label:losses+' derrotas nos últimos 3 jogos',type:'neg',detail:recentResults.join(' · ')});
  }

  // ── 4. CONSISTÊNCIA ──────────────────────────────────
  const scores = [
    {lbl:'Passes',    sc:cvScore(vWy,'passes',false)},
    {lbl:'Duelos',    sc:cvScore(vWy,'duelos',false)},
    {lbl:'Distância', sc:cvScore(vFis,'dist_total',true)},
    {lbl:'Carga',     sc:cvScore(vFis,'carga',true)},
  ].filter(x=>x.sc!==null);

  if(scores.length){
    const high=scores.filter(s=>s.sc>=75);
    const low =scores.filter(s=>s.sc<50);
    if(high.length) items.push({group:'Consistência',icon:'📊',label:'Consistente em: '+high.map(s=>s.lbl+' ('+s.sc+'/100)').join(', '),type:'pos',detail:''});
    if(low.length)  items.push({group:'Consistência',icon:'📉',label:'Irregular em: '+low.map(s=>s.lbl+' ('+s.sc+'/100)').join(', '),type:'neg',detail:'Alto coeficiente de variação'});
    const avg=Math.round(scores.reduce((a,s)=>a+s.sc,0)/scores.length);
    if(!high.length&&!low.length) items.push({group:'Consistência',icon:'➡️',label:'Consistência moderada (média '+avg+'/100)',type:'ok',detail:''});
  }

  // ── 5. CONTEXTUAL ────────────────────────────────────
  const casaGames=vWy.filter(g=>g.local==='Casa'), foraGames=vWy.filter(g=>g.local==='Fora');
  if(casaGames.length>=2 && foraGames.length>=2){
    function ctxAvg(arr,k){let tv=0,tm=0;arr.forEach(g=>{const v=parseFloat(g[k]),m=parseFloat(g.minutos_float||g.minutos||0);if(!isNaN(v)&&m>0){tv+=v;tm+=m;}});return tm>0?tv/tm*90:0;}
    const pHome=ctxAvg(casaGames,'passes'), pAway=ctxAvg(foraGames,'passes');
    const dHome=ctxAvg(casaGames,'duelos'), dAway=ctxAvg(foraGames,'duelos');
    if(pHome>0&&pAway>0){
      const diff=(pHome-pAway)/pAway*100;
      if(diff>15)       items.push({group:'Contextual',icon:'🏟️',label:'Melhor em casa (passes +'+Math.round(diff)+'% vs fora)',type:'pos',detail:casaGames.length+' jogos casa · '+foraGames.length+' fora'});
      else if(diff<-15) items.push({group:'Contextual',icon:'✈️',label:'Mais eficaz fora de casa (passes +'+Math.round(-diff)+'%)',type:'pos',detail:casaGames.length+' jogos casa · '+foraGames.length+' fora'});
    }
    // vitórias vs derrotas
    const vitGames=vWy.filter(g=>g.result==='V'), defGames=vWy.filter(g=>g.result==='D');
    if(vitGames.length>=2 && defGames.length>=2){
      const pVit=ctxAvg(vitGames,'passes'), pDef=ctxAvg(defGames,'passes');
      if(pVit>0&&pDef>0){
        const diff=(pVit-pDef)/pDef*100;
        if(Math.abs(diff)>15){
          if(diff>0) items.push({group:'Contextual',icon:'🏆',label:'Passa mais em jogos de vitória (+'+Math.round(diff)+'%)',type:'pos',detail:vitGames.length+'V · '+defGames.length+'D'});
          else       items.push({group:'Contextual',icon:'📌',label:'Rendimento técnico semelhante em V e D',type:'ok',detail:'Variação de apenas '+Math.round(Math.abs(diff))+'% de passes entre cenários'});
        }
      }
    }
  }

  // ── ALERTAS DE CARGA ─────────────────────────────────
  const alerts = getCargaAlerts(p);
  alerts.forEach(a=>{
    items.push({group:'Carga',icon:'🚨',label:a.tipo==='queda'?'Queda de rendimento físico':a.tipo==='alto'?'Carga elevada':'Pico de carga',type:'neg',detail:a.msg});
  });

  // ── RENDER ───────────────────────────────────────────
  const groups=['Técnico','Físico','Forma Recente','Consistência','Contextual','Carga'];
  const groupIcons={'Técnico':'⚽','Físico':'💪','Forma Recente':'🔥','Consistência':'📊','Contextual':'🔍','Carga':'⚡'};

  let html='<div style="font-size:10px;color:var(--muted);margin-bottom:14px;padding:6px 8px;background:#1a1500;border:1px solid #333;border-radius:3px">'+
    '📋 Resumo gerado automaticamente com base nos dados da temporada. Somente jogos ≥'+MIN_MINUTES+'min.</div>';

  groups.forEach(grp=>{
    const grpItems=items.filter(i=>i.group===grp);
    if(!grpItems.length)return;
    html+='<div style="margin-bottom:12px">'+
      '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)">'+groupIcons[grp]+' '+grp+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:4px">';
    grpItems.forEach(item=>{
      const bg = item.type==='pos'?'rgba(39,174,96,.1)':item.type==='neg'?'rgba(231,76,60,.1)':'rgba(201,162,39,.08)';
      const bc = item.type==='pos'?'#27ae60':item.type==='neg'?'#e74c3c':'#c9a227';
      const dot= item.type==='pos'?'✅':item.type==='neg'?'❌':'ℹ️';
      html+='<div style="background:'+bg+';border-left:3px solid '+bc+';border-radius:0 4px 4px 0;padding:7px 10px">'+
        '<div style="font-size:12px;font-weight:600;color:var(--text)">'+dot+' '+item.label+'</div>'+
        (item.detail?'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+item.detail+'</div>':'')+
      '</div>';
    });
    html+='</div></div>';
  });

  if(!items.length){
    html+='<div class="empty-state"><div class="es-text">Dados insuficientes para gerar resumo</div></div>';
  }

  // ── overall verdict ──────────────────────────────────
  const nPos=items.filter(i=>i.type==='pos').length;
  const nNeg=items.filter(i=>i.type==='neg').length;
  const verdict = nNeg===0&&nPos>=3?'🟢 Momento positivo — sem alertas significativos':
                  nNeg>=4?'🔴 Vários pontos de atenção identificados':
                  nNeg>=2?'🟡 Desempenho misto — atenção aos pontos negativos':
                  '🟢 Desempenho geral satisfatório';

  // ── narrative paragraph ───────────────────────────────
  function buildNarrative(){
    const nome = p.nome, pos = p.pos||'jogador';
    const jogos = vWy.length, total = p.wy.length;
    const sentences = [];

    // abertura
    const cobertura = total>0?Math.round(jogos/total*100):0;
    sentences.push(nome+' disputou '+jogos+' jogo'+(jogos!==1?'s':'')+' válidos (≥'+MIN_MINUTES+'min) de '+total+' possíveis na temporada'+
      (gols+asts>0?' e soma '+gols+' gol'+(gols!==1?'s':'')+' e '+asts+' assistênci'+(asts!==1?'as':'a')+'.':'.'));

    // técnico
    if(passes>0){
      const passStr = passAcc>=80?'apresenta boa circulação de bola, com '+passAcc+'% de precisão'
                    : passAcc>=65?'tem precisão razoável nos passes ('+passAcc+'%)'
                    : 'demonstra imprecisão nos passes ('+passAcc+'%)';
      const duelStr = duelosW>=55?'e domina bem os duelos diretos ('+duelosW+'% de aproveitamento)'
                    : duelosW<40?'mas ainda precisa melhorar no duelo individual ('+duelosW+'%)'
                    : 'com desempenho mediano nos duelos ('+duelosW+'%)';
      sentences.push('Tecnicamente, o atleta '+passStr+' '+duelStr+'.');
    }

    // recuperações/perdas
    if(recup>0&&perdas>0){
      const ratio=recup/perdas;
      if(ratio>=1.5) sentences.push('Destaca-se na recuperação de bola, com uma relação favorável de '+ratio.toFixed(1)+'x entre recuperações e perdas.');
      else if(ratio<0.8) sentences.push('A relação entre perdas ('+Math.round(perdas)+'/90) e recuperações ('+Math.round(recup)+'/90) é desfavorável, o que pode comprometer a fase defensiva.');
    }

    // físico
    if(vFis.length>=3){
      const mStr = mPerMin>=95?'apresenta intensidade física alta ('+mPerMin.toFixed(1)+' m/min), acima da referência'
                  : mPerMin>=80?'tem intensidade moderada ('+mPerMin.toFixed(1)+' m/min)'
                  : mPerMin>0?'registra intensidade abaixo de 80 m/min ('+mPerMin.toFixed(1)+'), o que pode indicar gestão de carga ou posição de menor demanda física':'';
      if(mStr){
        const cargaStr = carga>1100?', com carga de esforço elevada que merece atenção no planejamento de recuperação'
                       : carga>0&&carga<600?', com carga de esforço relativamente baixa'
                       : '';
        sentences.push('Fisicamente, '+mStr+cargaStr+'.');
      }
      // Distância por referência
      if(dist>0) sentences.push('Percorre em média '+fmtDist(dist)+'/90 (volume total).');
      if(vmax>=30) sentences.push('A velocidade máxima registrada ('+vmax.toFixed(1)+' km/h) evidencia boa capacidade de sprint.');
    }

    // forma recente
    const recentRes = p.wy.slice(-3).map(g=>g.result).filter(Boolean);
    const recentV = recentRes.filter(r=>r==='V').length;
    if(trendPass>10)
      sentences.push('Nos últimos 3 jogos, o jogador apresenta tendência de alta em participação técnica (+'+Math.round(trendPass)+'% em passes).');
    else if(trendPass<-15)
      sentences.push('Nos últimos 3 jogos, há queda perceptível de participação técnica ('+Math.round(trendPass)+'% em passes), o que pode indicar fadiga ou perda de espaço no sistema.');
    if(recentV>=2) sentences.push('O momento coletivo é positivo, com '+recentV+' vitórias nos últimos 3 jogos em que participou.');

    // consistência
    const allScores=scores;
    if(allScores.length){
      const avgSc=Math.round(allScores.reduce((a,s)=>a+s.sc,0)/allScores.length);
      const highSc=allScores.filter(s=>s.sc>=75);
      const lowSc=allScores.filter(s=>s.sc<50);
      if(highSc.length&&!lowSc.length) sentences.push('Em termos de consistência, mantém regularidade elevada nas métricas analisadas (média '+avgSc+'/100).');
      else if(lowSc.length) sentences.push('A consistência é um ponto de atenção: apresenta alta variabilidade em '+lowSc.map(s=>s.lbl.toLowerCase()).join(' e ')+', sugerindo oscilação de rendimento.');
      else sentences.push('Mostra regularidade moderada ('+avgSc+'/100), sem altos nem baixos extremos.');
    }

    // alertas de carga
    if(alerts.length) sentences.push('⚠️ Alerta de carga: '+alerts.map(a=>a.msg).join('; ')+'.');

    // fechamento
    const posLabels=items.filter(i=>i.type==='pos').map(i=>i.label.replace(/^[^\w]+/,'').split('(')[0].trim().toLowerCase());
    const negLabels=items.filter(i=>i.type==='neg').map(i=>i.label.replace(/^[^\w]+/,'').split('(')[0].trim().toLowerCase());
    if(posLabels.length&&!negLabels.length)
      sentences.push('De forma geral, o atleta apresenta desempenho positivo na temporada, sem pontos críticos identificados.');
    else if(negLabels.length>=3)
      sentences.push('Em síntese, o perfil atual indica necessidade de atenção em múltiplas dimensões do desempenho.');
    else if(posLabels.length>negLabels.length)
      sentences.push('O balanço geral é favorável, com mais pontos positivos do que alertas no período analisado.');

    return sentences.join(' ');
  }

  const narrativeHtml =
    '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:14px">'+
    '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">📝 Resumo Narrativo</div>'+
    '<div style="font-size:13px;line-height:1.75;color:var(--text)">'+buildNarrative()+'</div>'+
    '</div>';

  html='<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
    '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:700">'+verdict+'</div>'+
    '<div style="font-size:11px;color:var(--muted)">'+nPos+' positivos · '+nNeg+' alertas · '+items.filter(i=>i.type==='ok').length+' neutros</div>'+
  '</div>'+narrativeHtml+html;

  document.getElementById('detail-ia').innerHTML=html;
}

function toggleTheme(){
  const isLight = document.body.classList.toggle('light');
  document.getElementById('btn-theme').textContent = isLight ? '🌙' : '☀️';
  localStorage.setItem('bfg-theme', isLight ? 'light' : 'dark');
  // Update Chart.js defaults for theme
  applyChartTheme(isLight);
  // Re-render current detail tab to refresh charts
  if(selectedPlayer && document.getElementById('tab-detail')?.classList?.contains('active-pane')){
    const fns={tecnico:renderDTecnico,fisico:renderDFisico,forma:renderDForma,consist:renderDConsist,destaques:renderDDestaques,contextual:renderDContextual,bench:renderDBench,jogos:renderDJogos,ia:renderDIA};
    fns[detailTab]?.();
  }
}

function applyChartTheme(isLight){
  if(!window.Chart) return;
  const gridColor   = isLight ? 'rgba(0,0,0,0.08)'   : 'rgba(255,255,255,0.08)';
  const tickColor   = isLight ? '#666' : '#888';
  const radarGrid   = isLight ? 'rgba(0,0,0,0.10)'   : 'rgba(255,255,255,0.10)';
  Chart.defaults.scale.grid.color = gridColor;
  Chart.defaults.scale.ticks.color = tickColor;
}

function t(key){ return (I18N[currentLang]||I18N.pt)[key] || (I18N.pt[key]) || key; }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('bfg-lang', lang);
  document.getElementById('btn-lang-pt').classList.toggle('active-lang', lang==='pt');
  document.getElementById('btn-lang-en').classList.toggle('active-lang', lang==='en');
  // Update static data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(I18N[lang][k]) el.textContent = I18N[lang][k];
  });
  // Update sidebar labels
  const lbl = document.querySelector('.sidebar-header label');
  if(lbl) lbl.textContent = t('players_label');
  const srch = document.querySelector('.sidebar-search');
  if(srch) srch.placeholder = t('search_placeholder');
  // Re-render current tab to apply language
  const activeTab = document.querySelector('.tab.active')?.id?.replace('tab-btn-','');
  if(activeTab==='overview') renderOverview();
  else if(activeTab==='detail' && selectedPlayer) renderDetail();
  else if(activeTab==='compare') renderCompare();
}
